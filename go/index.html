<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Conversation Tree — redirecting…</title>
<meta name="description" content="Channel short link for the dsh-conversation-tree DSH plugin.">
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f6f2ea; color: #211d18;
  }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.15rem; margin: 0 0 .35rem; letter-spacing: .01em; }
  p { margin: 0 0 .9rem; opacity: .82; }
  a { color: #7a4a1f; }
  code { font-size: .85em; background: rgba(0,0,0,.06); padding: .1em .35em; border-radius: 4px; }
  .note { margin-top: 1.5rem; font-size: .78rem; opacity: .55; }
  @media (prefers-color-scheme: dark) {
    body { background: #211d18; color: #f6f2ea; }
    a { color: #e8b57c; }
    code { background: rgba(255,255,255,.1); }
  }
</style>
</head>
<body>
<main>
  <h1>Conversation Tree <span aria-hidden="true">→</span></h1>
  <p id="msg">Redirecting…</p>
  <p><a id="fallback" href="https://github.com/chriswang/dsh-conversation-tree#readme" rel="noopener">Continue manually</a></p>
  <p class="note">channel: <code id="ch">(none)</code> · install:
    <code>dsh plugin --profile web add dsh-conversation-tree</code></p>
</main>
<script>
(function () {
  // Destinations. Default = GitHub repo (README starts with the install command).
  // ?to=npm switches to the npm package page; extra keys are convenience aliases.
  var DEST = {
    github: 'https://github.com/chriswang/dsh-conversation-tree#readme',
    npm: 'https://www.npmjs.com/package/dsh-conversation-tree',
    awesome: 'https://awesome-dsh-plugin.com/p/chriswang/dsh-conversation-tree/',
    dshso: 'https://www.dsh.so/artifact/dsh-conversation-tree-2/'
  };
  // Recognised channel labels (?c=...). They all land on GitHub by default; the
  // label exists so link-by-link traffic can be attributed later (analytics).
  var CHANNELS = [
    'v2ex', 'zhihu', 'x', 'twitter', 'devto', 'dshbase', 'awesome',
    'reddit', 'bili', 'bilibili', 'jike', 'wechat', 'hackernews',
    'lcz', 'npm', 'dshso', 'github'
  ];
  var q;
  try { q = new URLSearchParams(location.search); } catch (e) { q = { get: function () { return null; } }; }
  var c = (q.get('c') || '').toLowerCase().replace(/[^a-z0-9._-]/g, '').slice(0, 32);
  if (c && CHANNELS.indexOf(c) === -1) { c = 'other-' + c; } // unknown: keep for attribution, still GitHub
  var to = (q.get('to') || '').toLowerCase();
  var key = Object.prototype.hasOwnProperty.call(DEST, to) ? to : 'github';
  var url = DEST[key];
  var chEl = document.getElementById('ch');
  if (chEl) { chEl.textContent = c || '(none)'; }
  var fb = document.getElementById('fallback');
  if (fb) { fb.href = url; }
  setTimeout(function () { location.replace(url); }, 60);
})();
</script>
</body>
</html>
